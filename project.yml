name: SegDown
options:
  bundleIdPrefix: com.math2it
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  SegDownCore:
    path: Packages/SegDownCore
targets:
  SegDown:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: assets/logo.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.math2it.segdown
        PRODUCT_NAME: SegDown
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: logo
    dependencies:
      - package: SegDownCore
        product: SegDownCore
      - target: segdown-host
        embed: true
        copy:
          destination: executables
      - target: SegDownSafari
        embed: true
  # Safari Web Extension, embedded at SegDown.app/Contents/PlugIns. Safari reads manifest.json at
  # the root of Contents/Resources, so the shared extension/ files land there with paths kept.
  SegDownSafari:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension
      - path: extension/manifest.json
        buildPhase: resources
      - path: extension/background.js
        buildPhase: resources
      - path: extension/content
        type: folder
        buildPhase: resources
      - path: extension/popup
        type: folder
        buildPhase: resources
      - path: extension/icons
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.math2it.segdown.safari
        PRODUCT_NAME: SegDownSafari
        INFOPLIST_FILE: SafariExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SafariExtension/SegDownSafari.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: SegDownCore
        product: SegDownCore
  segdown-host:
    type: tool
    platform: macOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_NAME: segdown-host
        PRODUCT_BUNDLE_IDENTIFIER: com.math2it.segdown.host
    dependencies:
      - package: SegDownCore
        product: SegDownCore
