name: SegDown
options:
  bundleIdPrefix: com.math2it
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  SegDownCore:
    path: Packages/SegDownCore
targets:
  SegDown:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: assets/logo.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.math2it.segdown
        PRODUCT_NAME: SegDown
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: logo
    dependencies:
      - package: SegDownCore
        product: SegDownCore
      - target: segdown-host
        embed: true
        copy:
          destination: executables
  segdown-host:
    type: tool
    platform: macOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_NAME: segdown-host
        PRODUCT_BUNDLE_IDENTIFIER: com.math2it.segdown.host
    dependencies:
      - package: SegDownCore
        product: SegDownCore
