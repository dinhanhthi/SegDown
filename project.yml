name: SegDown
options:
  bundleIdPrefix: com.math2it
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 86H6CNLN4C
    MARKETING_VERSION: 0.6.1
    CURRENT_PROJECT_VERSION: 8
packages:
  SegDownCore:
    path: Packages/SegDownCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Sparkle 2.10.0, pinned by commit (git ls-remote ... refs/tags/2.10.0; lightweight tag, no ^{}).
    revision: eef1a539a373c1f1a320624b1130fc5de7b2e100
targets:
  SegDown:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: assets/logo.icon
        buildPhase: resources
      - path: assets/logo_512.png
        buildPhase: resources
      # The Chromium extension at Contents/Resources/ChromeExtension; the app copies it to the folder
      # the user loads once (ExtensionFolder), so an app update also updates the extension.
      - path: extension/manifest.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ChromeExtension
      - path: extension/background.js
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ChromeExtension
      - path: extension/content
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ChromeExtension
      - path: extension/icons
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ChromeExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.math2it.segdown
        PRODUCT_NAME: SegDown
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/SegDown.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: logo
    dependencies:
      - package: SegDownCore
        product: SegDownCore
      - target: segdown-host
        embed: true
        copy:
          destination: executables
      - target: SegDownSafari
        embed: true
      - package: Sparkle
  # Safari Web Extension, embedded at SegDown.app/Contents/PlugIns. Safari reads manifest.json at
  # the root of Contents/Resources, so the shared extension/ files land there with paths kept.
  SegDownSafari:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension
      - path: extension/manifest.json
        buildPhase: resources
      - path: extension/background.js
        buildPhase: resources
      - path: extension/content
        type: folder
        buildPhase: resources
      - path: extension/icons
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.math2it.segdown.safari
        PRODUCT_NAME: SegDownSafari
        INFOPLIST_FILE: SafariExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SafariExtension/SegDownSafari.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: SegDownCore
        product: SegDownCore
  segdown-host:
    type: tool
    platform: macOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_NAME: segdown-host
        PRODUCT_BUNDLE_IDENTIFIER: com.math2it.segdown.host
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: SegDownCore
        product: SegDownCore
