name: Deploy appcast

# Publishes the Sparkle feed (appcast.xml) to GitHub Pages.
# The app's Sparkle feed (SUFeedURL) points at https://dinhanhthi.github.io/SegDown/appcast.xml.
# Each Pages deploy replaces the whole site, so appcast.xml is the only file staged.
# Requires Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'appcast.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Stage site
        run: |
          mkdir -p _site
          [ -f appcast.xml ] || { echo "::error::appcast.xml is missing"; exit 1; }
          cp appcast.xml _site/appcast.xml

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
